<style>
  :root{

  *{box-sizing:border-box;margin:0;padding:0}

  .wrap{width:100%;max-width:480px;min-width:0;position:relative}

  .leaf.a{top:-20px;right:-30px;transform:rotate(30deg)}
  .leaf.b{bottom:-10px;left:-40px;transform:rotate(-60deg)}
  .card{
    position:relative;z-index:1;
    background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-radius:28px;overflow:hidden;
    box-shadow:0 12px 40px -12px #2f6b5a44;

  h1 span{color:var(--green)}
  .time{
    margin-top:16px;display:flex;align-items:center;gap:12px;
    background:#FFF4EA;border:2px dashed #F3B988;border-radius:18px;padding:12px 16px;
  }
  .time svg{flex:none}
  .time b{display:block;font-size:22px;font-weight:600;color:var(--orange);line-height:1.2}
  .time small{font-size:14px;color:#9a6a45}
  ul{list-style:none;margin:18px 0 4px;display:grid;gap:10px}
  li{display:flex;gap:12px;align-items:center;font-size:16px;color:var(--ink2)}
  li i{flex:none;width:34px;height:34px;border-radius:12px;background:#E2F5EC;display:grid;place-items:center;font-style:normal}
  .cta{
    display:flex;align-items:center;justify-content:center;gap:10px;
    margin-top:22px;width:100%;min-height:62px;border-radius:99px;
    background:linear-gradient(180deg,#52B896,var(--green));color:#fff;text-decoration:none;
    font-size:21px;font-weight:600;letter-spacing:.2px;
    box-shadow:0 10px 22px -8px #3fa686aa, inset 0 2px 0 #ffffff40;
    animation:pulse 2.4s ease-in-out infinite;
    transition:transform .15s;
  }
  .cta:active{transform:scale(.97)}
  @keyframes pulse{0%,100%{box-shadow:0 10px 22px -8px #3fa686aa,0 0 0 0 #3fa68655}50%{box-shadow:0 10px 22px -8px #3fa686aa,0 0 0 12px #3fa68600}}
  .note{margin-top:12px;text-align:center;font-size:13px;color:#7a9a8e}
  .bear{display:block;margin:18px auto 0;width:92px;animation:bob 3s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  footer{position:relative;z-index:1;text-align:center;font-size:12px;color:#6f9486;margin-top:16px}
  @media (prefers-reduced-motion:reduce){.cta,.bear{animation:none}}
